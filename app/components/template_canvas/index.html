<!doctype html>
<html><head><meta charset="utf-8"><style>
html{overflow:hidden}
body{margin:0;font:14px system-ui;color:#243247}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:4px 0 8px}
.side-heading{font-weight:600;margin-bottom:8px}
#side-previews{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.side-thumbnail{display:flex;flex-direction:column;gap:5px;flex:0 1 140px;min-width:0;max-width:100%;text-align:left;padding:8px;background:#f8fafc}
.side-thumbnail[aria-pressed="true"]{background:#eaf2ff;border-color:#125bdb;box-shadow:0 0 0 1px #125bdb}
.thumbnail-image{display:flex;align-items:center;justify-content:center;width:100%;height:96px;background:white;pointer-events:none}
.thumbnail-image svg{width:100%;height:100%;pointer-events:none}
.thumbnail-name{font-weight:600;overflow-wrap:anywhere}
.thumbnail-detail{font-size:12px;color:#526077}
.canvas-empty{padding:32px 12px;color:#526077;background:#f8fafc}
button{padding:7px 12px;border:1px solid #94a3b8;background:white;border-radius:5px;color:#243247;cursor:pointer}
button[aria-pressed="true"]{background:#dbeafe;border-color:#125bdb}
button:disabled{opacity:.45;cursor:default}
#delete-boxes:not(:disabled){color:#a12626;border-color:#c98989}
#canvas{width:100%;overflow:visible}
svg{display:block;width:100%;height:auto;touch-action:pan-y;user-select:none}
svg.selection-mode,[data-slot-id]{touch-action:none}
[data-slot-id]{cursor:move}
svg text{pointer-events:none}
.selected{stroke:#125bdb!important;stroke-width:3!important}
.active-section{stroke:#125bdb;stroke-width:2.5}
.selection-rectangle{fill:#3b82f6;fill-opacity:.15;stroke:#125bdb;stroke-width:1.5;stroke-dasharray:4 2;pointer-events:none}
#status{padding:6px 2px;min-height:20px}
svg :focus{outline:2px solid #125bdb}
</style></head><body><div class="side-heading">Sides - click a preview to edit</div><div id="side-previews" role="group" aria-label="Template sides"></div><div class="toolbar"><button id="selection-mode" aria-pressed="false">Select boxes</button><button id="delete-boxes" disabled title="Delete all highlighted boxes">Delete boxes</button></div><div id="canvas"></div><div id="status" aria-live="polite"></div><script src="canvas.js"></script></body></html>
